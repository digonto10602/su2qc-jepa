[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "su2qc-jepa"
version = "0.1.0"
description = "Gauge-JEPA-P v2: a JEPA world model for SU(2) string breaking on one plaquette, with a Krylov-chain hardware carrier"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Digonto"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6",
  "qiskit>=2.0",
  "qiskit-aer>=0.15",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "scikit-learn>=1.3"]
ibm = ["qiskit-ibm-runtime>=0.30", "mthree>=2.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8", "pytest-cov", "graphifyy==0.9.74"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests (j_max = 1 reference, long twin runs)"]
addopts = "-m 'not slow' -q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008", "B905", "E741", "E731", "B007"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
