name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install scikit-learn
      - name: Lint
        run: ruff check src tests scripts
      - name: Numbered-artifact conventions (decisions/001)
        run: python scripts/check_artifacts.py
      - name: Tests (fast)
        run: python -m pytest -q
      - name: Code graph is committed and fresh (decisions/001)
        run: bash scripts/graph_update.sh --check
      - name: Physics fingerprints as evidence
        run: python scripts/run_gate.py J0 --quick || true
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
